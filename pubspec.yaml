# Responsibility: Flutter package configuration for PhysicsTracker.
name: physics_tracker
publish_to: 'none'
description: PhysicsTracker Android motion analysis app.
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3
  video_player: ^2.11.0
  fl_chart: ^1.1.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  camera: ^0.11.4
  file_picker: ^10.3.10
  freezed_annotation: 2.4.4
  uuid: ^4.5.3
  ffmpeg_kit_flutter_new: ^4.1.0
  image: ^4.5.4
  sensors_plus: ^7.0.0
  image_picker: ^1.2.0
  shared_preferences: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icons/

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0-dev.11
  freezed: 2.5.2
  hive_generator: 2.0.1
  flutter_lints: ^6.0.0
